# dsh-token-usage bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field) over dsh-base; activate with
#   dsh plugin --profile web add <package>
#   dsh plugin --profile web add link:<this-directory>   (local development)
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (SessionPersistence reads, /dsh-token-usage routes), and the
# dsh.client declaration in package.json makes the browser half
# (exports "./client") load in the web GUI (settings sidebar entry).
- insert:
    - id: dsh-token-usage
      name: '@kelearns/dsh-token-usage'
